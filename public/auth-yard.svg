<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="80" y1="20" x2="480" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a594f9" stop-opacity=".22"/>
      <stop offset="1" stop-color="#bef264" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="300" x2="560" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2e2e36" stop-opacity=".0"/>
      <stop offset=".45" stop-color="#2e2e36" stop-opacity=".35"/>
      <stop offset="1" stop-color="#1a1a1a" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <rect width="560" height="420" fill="url(#sky)"/>
  <ellipse cx="280" cy="360" rx="220" ry="48" fill="url(#ground)"/>

  <!-- Soft sun / glow -->
  <circle cx="430" cy="88" r="42" fill="#bef264" fill-opacity=".18"/>
  <circle cx="430" cy="88" r="22" fill="#bef264" fill-opacity=".28"/>

  <!-- Factory hall -->
  <path d="M92 268V168l78-36 78 36v100H92Z" fill="#1f1f26" stroke="#a594f9" stroke-opacity=".35" stroke-width="1.5"/>
  <path d="M92 168l78-36 78 36" stroke="#d4cbff" stroke-opacity=".45" stroke-width="1.5"/>
  <rect x="118" y="198" width="28" height="36" rx="4" fill="#a594f9" fill-opacity=".2" stroke="#b8a9ff" stroke-opacity=".4"/>
  <rect x="168" y="198" width="28" height="36" rx="4" fill="#a594f9" fill-opacity=".2" stroke="#b8a9ff" stroke-opacity=".4"/>
  <rect x="218" y="210" width="18" height="58" rx="3" fill="#8b7cf7" fill-opacity=".35"/>

  <!-- Chimney -->
  <rect x="236" y="108" width="16" height="52" rx="3" fill="#45454f"/>
  <path d="M240 96c8-10 18-14 28-12" stroke="#d4cbff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
  <path d="M246 86c10-12 22-16 34-12" stroke="#d4cbff" stroke-opacity=".22" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pallet of blocks -->
  <g transform="translate(300 230)">
    <rect x="0" y="78" width="148" height="10" rx="2" fill="#45454f"/>
    <rect x="8" y="54" width="40" height="22" rx="3" fill="#8b7cf7" fill-opacity=".55"/>
    <rect x="54" y="54" width="40" height="22" rx="3" fill="#a594f9" fill-opacity=".5"/>
    <rect x="100" y="54" width="40" height="22" rx="3" fill="#8b7cf7" fill-opacity=".45"/>
    <rect x="8" y="28" width="40" height="22" rx="3" fill="#b8a9ff" fill-opacity=".4"/>
    <rect x="54" y="28" width="40" height="22" rx="3" fill="#8b7cf7" fill-opacity=".5"/>
    <rect x="100" y="28" width="40" height="22" rx="3" fill="#a594f9" fill-opacity=".42"/>
    <rect x="30" y="2" width="40" height="22" rx="3" fill="#d4cbff" fill-opacity=".35"/>
    <rect x="76" y="2" width="40" height="22" rx="3" fill="#a594f9" fill-opacity=".4"/>
  </g>

  <!-- Cement bags -->
  <g transform="translate(78 278)">
    <path d="M0 42h36l6-28H6L0 42Z" fill="#63646f"/>
    <path d="M6 14h30l6 28H12L6 14Z" fill="#8a8b96"/>
    <rect x="14" y="24" width="18" height="6" rx="1" fill="#bef264" fill-opacity=".55"/>
    <path d="M48 42h36l6-28H54L48 42Z" fill="#63646f"/>
    <path d="M54 14h30l6 28H60L54 14Z" fill="#8a8b96"/>
    <rect x="62" y="24" width="18" height="6" rx="1" fill="#bef264" fill-opacity=".45"/>
  </g>

  <!-- Soft path -->
  <path d="M40 340c80-18 160-18 240 0s160 18 240 0" stroke="#a594f9" stroke-opacity=".18" stroke-width="10" stroke-linecap="round"/>
</svg>
